<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gamer Store Ultra</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0b1020;color:#fff;padding-bottom:90px}button{cursor:pointer;border:none;border-radius:12px;padding:10px 14px;margin:4px}.primary{background:#7c3aed;color:#fff}.green{background:#10b981;color:#000}.ghost{background:transparent;color:#10b981;border:1px solid #10b981}input,select{padding:10px;border-radius:10px;border:1px solid #444;background:#111827;color:#fff}.topbar,.device,nav,.hero,.container{padding:15px}.topbar{background:#111827;text-align:center}.device{text-align:center}.hero{text-align:center;background:#151a26}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.product,.panel{background:#151a26;padding:15px;border-radius:16px}.product img{width:100%;height:160px;object-fit:cover;border-radius:12px}.cartbar{position:fixed;bottom:0;left:0;right:0;background:#111827;padding:12px;display:flex;justify-content:space-around}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);align-items:center;justify-content:center}.modal-content{background:#151a26;padding:20px;border-radius:16px;width:90%;max-width:400px}.item{padding:8px;border-bottom:1px solid #333}
</style>
</head>
<body>
<div class="topbar">⚡ Flash Sale | Use GAMER10</div>
<div class="device">
<button class="ghost" onclick="setDevice('desktop')">💻 Computer</button>
<button class="ghost" onclick="setDevice('tablet')">📱 Tablet</button>
<button class="ghost" onclick="setDevice('phone')">📲 Phone</button>
</div>
<nav>
<button onclick="openModal('accountModal')">👤 Account</button>
<button onclick="openOrders()">📦 Orders</button>
<button onclick="openWishlist()">❤️ Wishlist</button>
<button onclick="shareStore()">📤 Share</button>
</nav>
<section class="hero">
<h1>🎮 Gamer Store Ultra</h1>
<button class="primary" onclick="scrollToProducts()">Products</button>
<button class="green" onclick="contactSupport()">Contact Us</button>
<button class="ghost" onclick="filterCategory('Games')">Games</button>
<button class="ghost" onclick="filterCategory('Phones')">Phones</button>
</section>
<div class="container">
<section class="panel">
<input id="search" placeholder="Search" oninput="renderProducts()">
<select id="category" onchange="renderProducts()">
<option value="all">All</option>
<option value="Games">Games</option>
<option value="Phones">Phones</option>
<option value="Consoles">Consoles</option>
</select>
</section>
<h2 id="productsTitle">Products</h2>
<div id="products" class="products"></div>
</div>
<div class="cartbar">
<span>🛒 <b id="cartCount">0</b></span>
<span>Q<b id="cartTotal">0</b></span>
<button class="primary" onclick="openPayment()">💳 Pay</button>
</div>
<div class="modal" id="accountModal"><div class="modal-content"><h2>Account</h2><input id="name" placeholder="Name"><button onclick="saveAccount()">Save</button><button onclick="closeModal('accountModal')">Close</button></div></div>
<div class="modal" id="ordersModal"><div class="modal-content"><h2>Orders</h2><div id="ordersBox"></div><button onclick="closeModal('ordersModal')">Close</button></div></div>
<div class="modal" id="wishlistModal"><div class="modal-content"><h2>Wishlist</h2><div id="wishBox"></div><button onclick="closeModal('wishlistModal')">Close</button></div></div>
<div class="modal" id="paymentModal"><div class="modal-content"><h2>Payment</h2><button onclick="finishPayment()">Complete Payment</button><button onclick="closeModal('paymentModal')">Close</button></div></div>
<script>
let products=[
{name:'PS5 Console',price:4200,cat:'Consoles',img:'https://images.unsplash.com/photo-1606144042614-b2417e99c4e3'},
{name:'Gaming Phone',price:3500,cat:'Phones',img:'https://images.unsplash.com/photo-1511707171634-5f897ff02aa9'},
{name:'Battle Game',price:400,cat:'Games',img:'https://images.unsplash.com/photo-1511512578047-dfb367046420'}
];
let cart=[];
let orders=[];
let wishlist=[];
function renderProducts(){
let q=document.getElementById('search').value.toLowerCase();
let cat=document.getElementById('category').value;
let box=document.getElementById('products');
box.innerHTML='';
products.filter(p=>(cat==='all'||p.cat===cat)&&p.name.toLowerCase().includes(q)).forEach(p=>{
box.innerHTML+=`<div class="product"><img src="${p.img}"><h3>${p.name}</h3><p>Q${p.price}</p><button onclick="addToCart('${p.name}',${p.price})">Add to cart</button><button onclick="addWish('${p.name}')">❤️</button></div>`;
});
}
function addToCart(name,price){let item=cart.find(i=>i.name===name);if(item){item.qty++}else{cart.push({name,price,qty:1})}updateCart();}
function updateCart(){let total=0,count=0;cart.forEach(i=>{total+=i.price*i.qty;count+=i.qty});document.getElementById('cartCount').textContent=count;document.getElementById('cartTotal').textContent=total;}
function addWish(name){if(!wishlist.includes(name))wishlist.push(name);alert('Added to wishlist');}
function openModal(id){document.getElementById(id).style.display='flex';}
function closeModal(id){document.getElementById(id).style.display='none';}
function openOrders(){document.getElementById('ordersBox').innerHTML=orders.length?orders.map(o=>`<div class='item'>${o}</div>`).join(''):'No orders yet';openModal('ordersModal');}
function openWishlist(){document.getElementById('wishBox').innerHTML=wishlist.length?wishlist.map(w=>`<div class='item'>${w}</div>`).join(''):'Empty';openModal('wishlistModal');}
function shareStore(){prompt('Copy your store link:',location.href);}
function contactSupport(){window.open('https://wa.me/50237223083','_blank');}
function openPayment(){if(cart.length===0){alert('Cart is empty');return;}openModal('paymentModal');}
function finishPayment(){orders.push('Order completed: '+cart.length+' items');cart=[];updateCart();closeModal('paymentModal');alert('Payment completed');}
function scrollToProducts(){document.getElementById('productsTitle').scrollIntoView({behavior:'smooth'});}
function filterCategory(cat){document.getElementById('category').value=cat;renderProducts();scrollToProducts();}
function saveAccount(){localStorage.setItem('name',document.getElementById('name').value);alert('Account saved');}
function setDevice(mode){document.body.className=mode;}
renderProducts();
updateCart();
</script>
</body>
</html>
